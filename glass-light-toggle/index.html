<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0d0d" />
<link rel="icon" href="data:," />
<title>Glass Light Toggle</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0d0d; overflow: hidden; }
  canvas#gl {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(36px + env(safe-area-inset-bottom));
    text-align: center;
    font: 500 11px/1 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.28);
    pointer-events: none; user-select: none;
    transition: color 0.6s ease;
  }
  @media (max-width: 640px) {
    #hint { bottom: calc(104px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<canvas id="gl" aria-label="Glass Light Toggle" role="switch" aria-checked="false"></canvas>
<div id="hint">Click or drag</div>
<script defer src="./main.js"></script>
</body>
</html>
